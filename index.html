<style>
:root{
  --gece:#202330;      /* zemin — mevcut markadan */
  --gece2:#191c27;     /* defter kartları */
  --cizgi:#363b4e;     /* ince çizgiler */
  --sut:#f1efe8;       /* mürekkep değil, süt */
  --duman:#9aa0b8;     /* ikincil metin */
  --altin:#e3b458;     /* nasip altını */
  --muhur:#d4695b;     /* ret mührü kırmızısı */
  --muhur-acik:#e08575;/* küçük metinde okunur kırmızı */
}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;
  background:var(--gece);
  background-image:radial-gradient(1100px 600px at 50% -10%, #262a3a 0%, var(--gece) 62%);
  color:var(--sut);
  font-family:"Poppins",-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.6;
  min-height:100svh;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  overflow-x:hidden;
}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
a{color:var(--altin)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--altin);outline-offset:3px;border-radius:6px}

/* ——— açılış: el yazısı ——— */
#giris{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  background:var(--gece);border:0;padding:0;margin:0;cursor:pointer;width:100%;
  transition:opacity .6s ease;
}
#giris[hidden]{display:none}
#giris.out{opacity:0;pointer-events:none}
#giris svg{max-width:88%;height:auto}
#giris path{
  stroke-dasharray:900;stroke-dashoffset:900;
  animation:cizgi 1.5s ease forwards .1s;
  fill:transparent;
}
#giris path:nth-child(11){stroke-dasharray:800;stroke-dashoffset:800}
#giris path:nth-child(12){stroke-dasharray:700;stroke-dashoffset:700}
#giris path:nth-child(13){stroke-dasharray:600;stroke-dashoffset:600}
#giris.dolu path{animation:cizgi 1.5s ease forwards .1s, dol .7s ease forwards 1.25s}
@keyframes cizgi{to{stroke-dashoffset:0}}
@keyframes dol{to{fill:#fff}}

/* ——— yerleşim ——— */
.sayfa{max-width:600px;margin:0 auto;padding:32px 20px 40px}
header.ust{text-align:center;padding-top:8px}
.marka{
  font-weight:700;font-size:1.05rem;letter-spacing:.02em;color:var(--sut);
  text-decoration:none;display:inline-block;
}
.marka .nokta{color:var(--altin)}
main{display:block}
.kapak{text-align:center;margin:9vh 0 34px}
.kapak h1{
  font-family:"Fraunces","Georgia",serif;font-weight:600;
  font-size:clamp(1.9rem, 6.4vw, 2.7rem);
  line-height:1.2;margin:0 0 12px;text-wrap:balance;
}
.kapak p{color:var(--duman);margin:0 auto;max-width:42ch;font-size:.98rem;text-wrap:pretty}

/* form */
.sorgu{display:flex;gap:10px;margin:26px 0 8px;flex-wrap:wrap}
.sorgu input{
  flex:1 1 260px;min-height:52px;padding:12px 18px;
  font:inherit;font-size:1.05rem;color:var(--sut);
  background:var(--gece2);border:1px solid var(--cizgi);border-radius:14px;
}
.sorgu input::placeholder{color:#767c95}
.sorgu input:focus-visible{outline:2px solid var(--altin);outline-offset:2px}
.sorgu button{
  flex:1 1 auto;
  min-height:52px;padding:12px 26px;border:0;border-radius:14px;
  background:var(--altin);color:#1c1e29;font:inherit;font-weight:700;font-size:1rem;
  cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;
}
.sorgu button:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(227,180,88,.22)}
.sorgu button:active{transform:translateY(0)}
.sorgu button[disabled]{opacity:.6;cursor:wait;transform:none;box-shadow:none}
#hata{color:var(--muhur-acik);font-size:.9rem;min-height:1.4em;margin:2px 4px 0}
.titre{animation:titre .3s ease}
@keyframes titre{25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}

/* ——— kader defteri kaydı ——— */
#cevap{min-height:10px}
.dusunce{
  color:var(--duman);font-style:italic;font-family:"Fraunces",serif;
  text-align:center;padding:26px 0;font-size:1.1rem;
}
.kayit{
  background:var(--gece2);border:1px solid var(--cizgi);border-radius:18px;
  padding:26px 26px 20px;margin-top:18px;
  animation:gel .45s ease;
  overflow-wrap:break-word;
}
@keyframes gel{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kayit .soru-eko{
  color:var(--duman);font-size:1rem;margin:0 0 10px;
  font-family:"Fraunces","Georgia",serif;font-style:italic;
}
.kayit .yanit{
  font-family:"Fraunces","Georgia",serif;font-weight:500;
  font-size:clamp(1.45rem, 4.6vw, 1.9rem);line-height:1.35;
  margin:0 0 18px;text-wrap:pretty;
}
.muhur-satir{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.muhur{
  display:inline-block;padding:.28em .7em;border:3px solid var(--altin);border-radius:8px;
  color:var(--altin);font-weight:700;font-size:.95rem;letter-spacing:.14em;
  transform:rotate(-4deg);
  animation:bas .35s cubic-bezier(.2,1.4,.4,1);
}
.muhur.yok{border-color:var(--muhur);color:var(--muhur)}
.muhur.bekle{border-style:dashed;border-color:var(--duman);color:var(--duman)}
.muhur.kapandi{border-color:var(--muhur);color:var(--muhur);border-style:double;border-width:4px}
@keyframes bas{from{opacity:0;transform:rotate(-4deg) scale(1.5)}to{opacity:1;transform:rotate(-4deg) scale(1)}}
.kayit-no{color:var(--duman);font-size:.85rem;letter-spacing:.05em;font-variant-numeric:tabular-nums}
.kayit .not{color:var(--duman);font-size:.85rem;margin:0 0 16px}
.paylas{display:flex;gap:10px;flex-wrap:wrap}
.paylas button{
  min-height:44px;padding:9px 18px;border-radius:12px;border:1px solid var(--cizgi);
  background:transparent;color:var(--sut);font:inherit;font-size:.92rem;cursor:pointer;
  transition:border-color .15s ease,color .15s ease;
}
.paylas button:hover{border-color:var(--altin);color:var(--altin)}

/* ——— ayraç + günün nasibi ——— */
.ayrac{
  position:relative;border:0;padding:0;margin:44px 0 26px;
  height:1px;background:var(--cizgi);overflow:visible;
}
.ayrac::after{
  content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;
  background:var(--altin);transform:translate(-50%,-50%);
  box-shadow:0 0 0 10px var(--gece);
}
.gunluk{
  border:1px solid var(--cizgi);border-radius:18px;padding:22px 26px;
  background:linear-gradient(180deg, rgba(227,180,88,.05), rgba(227,180,88,0) 55%), var(--gece2);
}
.gunluk .etiket{
  color:var(--altin);font-size:.78rem;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;margin:0 0 10px;font-family:inherit;
}
.gunluk .nasip{
  font-family:"Fraunces","Georgia",serif;font-size:1.18rem;line-height:1.5;margin:0;text-wrap:pretty;
}

/* ——— alt ——— */
footer{
  margin-top:52px;padding-top:20px;border-top:1px solid var(--cizgi);
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  color:var(--duman);font-size:.82rem;
}
footer .replay{
  background:none;border:0;padding:4px 0;color:var(--duman);font:inherit;font-size:.82rem;
  cursor:pointer;font-style:italic;
}
footer .replay:hover{color:var(--sut)}
footer a{color:var(--duman);text-decoration:none}
footer a:hover{color:var(--sut)}
@media (max-width:480px){
  footer{flex-direction:column;gap:8px;text-align:center;justify-content:center}
}

/* giriş sonrası yumuşak geliş */
body.hazir .yuksel{animation:gel .5s ease backwards}
body.hazir .yuksel:nth-child(2){animation-delay:.08s}
body.hazir .yuksel:nth-child(3){animation-delay:.16s}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>

<div class="sayfa">
  <header class="ust yuksel">
    <a class="marka" href="/" translate="no">nasipte varsa<span class="nokta">.</span></a>
  </header>

  <main>
    <section class="kapak yuksel">
      <h1>Olacak mı, olmayacak mı?</h1>
      <p>Sorunu yaz, cevabı kader versin. Aynı soruya hep aynı cevap çıkar — yazılmış bir kere.</p>

  </main>

  </footer>
</div>

/* deterministik: aynı soru → aynı kayıt */
function duzle(s){
  return s.toLocaleLowerCase("tr-TR")
    .replace(/[.,!?;:"'“”‘’()\[\]]/g," ")
    .replace(/\s+/g," ").trim();
}
function hashle(s){
  var h = 2166136261;
  for (var i = 0; i < s.length; i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function cevapla(soru){
  var d = duzle(soru);
  var h = hashle(d);
  var c = OZEL[d] || CEVAPLAR[h % CEVAPLAR.length];
  return {c:c, no:1000 + (h % 9000)};
}

var $ = function(id){ return document.getElementById(id); };
var giris = $("giris"), form = $("form"), soruEl = $("soru"),
    sorBtn = $("sor"), cevapEl = $("cevap"), hataEl = $("hata");
var azHareket = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var paylasilan = null;
try {
  var m = location.hash.match(/[#&]q=([^&]+)/);
  if (m) paylasilan = decodeURIComponent(m[1]);
} catch(e){}

/* açılış animasyonu */
function girisiKapat(){
  if (giris.hidden) return;
  giris.classList.add("out");
  document.body.classList.add("hazir");
  window.setTimeout(function(){ giris.hidden = true; }, 650);
}
if (!paylasilan && !azHareket){
  giris.hidden = false;
  giris.addEventListener("click", girisiKapat);
  window.setTimeout(girisiKapat, 2300);
} else {
  document.body.classList.add("hazir");
}
$("tekrar").addEventListener("click", function(){
  history.replaceState(null, "", location.pathname);
  location.reload();
});

/* örnek soru dolaşımı */
var ornekIdx = 0;
window.setInterval(function(){
  if (document.activeElement === soruEl || soruEl.value) return;
  ornekIdx = (ornekIdx + 1) % ORNEKLER.length;
  soruEl.placeholder = ORNEKLER[ornekIdx];
}, 3500);

/* günün nasibi */
(function(){
  var simdi = new Date();
  var yilBasi = new Date(simdi.getFullYear(), 0, 0);
  var gunNo = Math.floor((simdi - yilBasi) / 86400000);
  $("gun-nasip").textContent = NASIPLER[(simdi.getFullYear() * 366 + gunNo) % NASIPLER.length];
  var tarih = new Intl.DateTimeFormat("tr-TR", {day:"numeric", month:"long", weekday:"long"}).format(simdi);
  $("gun-etiket").textContent = "Günün Nasibi · " + tarih;
})();

/* sorma akışı */
var mesgul = false;
function sor(soru, hizli){
  if (mesgul) return;
  var temiz = soru.trim();
  if (!temiz){
    hataEl.textContent = "Sormadan nasip olmaz.";
    if (!azHareket){
      form.classList.remove("titre");
      void form.offsetWidth;
      form.classList.add("titre");
    }
    soruEl.focus();
    return;
  }
  hataEl.textContent = "";
  mesgul = true;
  sorBtn.disabled = true;
  sorBtn.textContent = "Soruluyor…";
  soruEl.blur();

  var sonuc = cevapla(temiz);
  history.replaceState(null, "", "#q=" + encodeURIComponent(temiz));

  var dus = document.createElement("p");
  dus.className = "dusunce";
  dus.setAttribute("aria-hidden", "true");
  cevapEl.textContent = "";
  cevapEl.appendChild(dus);
  var di = Math.floor(Math.random() * DUSUNCELER.length);
  dus.textContent = DUSUNCELER[di];
  var donme = window.setInterval(function(){
    di = (di + 1) % DUSUNCELER.length;
    dus.textContent = DUSUNCELER[di];
  }, 560);

  window.setTimeout(function(){
    window.clearInterval(donme);
    goster(temiz, sonuc);
    mesgul = false;
    sorBtn.disabled = false;
    sorBtn.textContent = "Kadere Danış";
  }, (hizli || azHareket) ? 400 : 1700);
}

function goster(soru, sonuc){
  var kart = document.createElement("div");
  kart.className = "kayit";

  var eko = document.createElement("p");
  eko.className = "soru-eko";
  eko.textContent = "“" + soru + "”";

  var yanit = document.createElement("p");
  yanit.className = "yanit";
  yanit.textContent = sonuc.c.t;

  var satir = document.createElement("div");
  satir.className = "muhur-satir";
  var muhur = document.createElement("span");
  muhur.className = "muhur " + sonuc.c.k;
  muhur.textContent = MUHURLER[sonuc.c.k];
  var no = document.createElement("span");
  no.className = "kayit-no";
  no.textContent = "Kayıt №" + sonuc.no;
  satir.appendChild(muhur);
  satir.appendChild(no);

  var not = document.createElement("p");
  not.className = "not";
  not.textContent = "Aynı soru, aynı kayıt — kader fikrini değiştirmez.";

  var paylas = document.createElement("div");
  paylas.className = "paylas";
  var kopyala = document.createElement("button");
  kopyala.type = "button";
  kopyala.textContent = "Linki Kopyala";
  kopyala.addEventListener("click", function(){
    var url = location.origin + location.pathname + "#q=" + encodeURIComponent(soru);
    var eski = "Linki Kopyala";
    function tamam(){ kopyala.textContent = "Kopyalandı ✓"; window.setTimeout(function(){ kopyala.textContent = eski; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(tamam, function(){ eskiKopyala(url); tamam(); });
    } else { eskiKopyala(url); tamam(); }
  });
  paylas.appendChild(kopyala);
  if (navigator.share){
    var pb = document.createElement("button");
    pb.type = "button";
    pb.textContent = "Paylaş";
    pb.addEventListener("click", function(){
      navigator.share({
        title: "Nasipte Varsa",
        text: "“" + soru + "” diye sordum, kader “" + sonuc.c.t + "” dedi.",
        url: location.origin + location.pathname + "#q=" + encodeURIComponent(soru)
      }).catch(function(){});
    });
    paylas.appendChild(pb);
  }

  kart.appendChild(eko);
  kart.appendChild(yanit);
  kart.appendChild(satir);
  kart.appendChild(not);
  kart.appendChild(paylas);
  cevapEl.textContent = "";
  cevapEl.appendChild(kart);
  kart.scrollIntoView({block:"nearest", behavior: azHareket ? "auto" : "smooth"});
}

function eskiKopyala(metin){
  var ta = document.createElement("textarea");
  ta.value = metin;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
}

form.addEventListener("submit", function(e){
  e.preventDefault();
  sor(soruEl.value, false);
});

/* paylaşılan link ile gelindiyse */
if (paylasilan){
  soruEl.value = paylasilan;
  sor(paylasilan, true);
}
</script>
